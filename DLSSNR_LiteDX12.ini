[General]
; Optional configuration directory. Supports environment variables such as %LOCALAPPDATA%.
; Empty: save beside the plugin; on write failure use a per-game user profile.
; DLSSNR_LiteDX12_CONFIG_DIR overrides this setting. The file name stays DLSSNR_LiteDX12.ini.
ConfigDirectory=
Enabled=1

[NeuralRendering]
Enabled=0
; NR GPU timing follows panel visibility automatically; no configuration switch.
; 0 Game, 1 Measured, 2 Manual.
WhiteMode=0
; 0 pre-exposure / exposure; 1 exposure / pre-exposure. Game mode only; the
; texture value swaps sides with the pre-exposure, it is never inverted.
WhiteRatio=0
WhiteUseTexture=1
; Unchecked inputs substitute 1; texture retains priority over the scalar scale.
WhiteUsePreExposure=1
WhiteUseExposureScale=1
ManualWhite=1
; Multiplier on Game/Measured white; panel and config range 0.001 to 1024.
WhiteTrim=1
; Game exposure ratio exponent: white = (pre/exposure)^n * trim, or
; (exposure/pre)^n * trim when WhiteRatio=1. 1 = linear.
WhiteExponent=1
WhiteAnchor=0.18
WhiteTau=0.3
WhiteDeadband=0.08
WhiteAttack=1
WhiteRelease=0.5
WhiteEvery=4
Preset=0
Style=0
Intensity=1
Structure=1
Tone=1
Skin=-1
AutoMask=1
; Model UI correction hint (DLSSNR.UICorrection). Changing it rebuilds NR histories.
UICorrection=0
; Amplify the final resolved NR difference once: 0 original, 1 normal NR, 2 double.
DifferenceGain=1
ComposedRestore=1

[Diagnostics]
; 0 Off (no file, no message formatting), 1 startup/failure/state changes,
; 2 additional verbose diagnostics.
; Read at startup. The log sits beside the active configuration and is rewritten
; once per process run. Legacy [General] Log=0/1 still works when Level is absent.
Level=1
; Opt-in: return swap chains whose requested/actual width or height is below 100
; unchanged. GTA V Enhanced creates an auxiliary 180x44 chain; wrapping it breaks
; the game, so only that target enables it.
SkipSmallSwapchains=0
; Opt-in: NR copies Color/Depth/MV and resolves into the captured color UAV.
; Enable only when that color is UAV-capable and in UNORDERED_ACCESS state.
DirectResolve=0
; Run the GPU timing path even with the panel closed (the panel's GPU timing checkbox
; writes this). Needed by games that resolve NR into their own colour: only the timestamp
; EndQuery drains the pipeline far enough for the game's later reads to see the resolve,
; and without it only the top strip of the frame keeps NR. Off by default.
ForceTiming=0
; Default 1: NR refuses a recording whose command list has no captured compute root
; signature, because the restore cannot be verified (bindless engines crashed).
; Set 0 only for a game that never binds a compute root before its NGX evaluation.
RequireComputeSignature=1
ResourceScale=1
; Display-only proximity contrast curve on the depth preview. Model depth is unchanged.
DepthContrast=0

[Resources]
; Correct bottom-up depth for the preview and the NR guide. Color/MV are unchanged.
DepthUpsideDown=0
